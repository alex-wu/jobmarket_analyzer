name: scorecard

# OpenSSF Scorecard — weekly automated supply-chain security audit.
# Publishes results to <https://scorecard.dev> and uploads SARIF to the
# repo's Security tab. Free on public repos.

on:
  branch_protection_rule:
  schedule:
    - cron: "0 9 * * 1"   # Monday 09:00 UTC, after CodeQL's 08:00 tick
  push:
    branches: [main]

permissions: read-all

concurrency:
  group: scorecard
  cancel-in-progress: false

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF to code-scanning
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: results.sarif
