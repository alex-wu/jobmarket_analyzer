name: refresh

# Weekly Monday 06:00 UTC per ADR-018. workflow_dispatch always available
# for manual smoke testing. Matrix fan-out over presets (ADR-019) lets us
# add a new role/geo by appending a single line to strategy.matrix.preset.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write   # required for `gh release upload/create`
  issues: write     # failure-alert step files an issue on red cron runs

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        preset:
          - data_analyst_eu
    # Per-preset concurrency keeps cross-preset runs parallel while still
    # preventing two refreshes of the SAME preset from clobbering each other
    # (e.g. cron + workflow_dispatch racing). Workflow-scope concurrency
    # cannot reference matrix context — see pitfall.
    concurrency:
      group: refresh-${{ matrix.preset }}
      cancel-in-progress: false
    env:
      ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
      ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PRESET: ${{ matrix.preset }}
      ACCUMULATE_WINDOW_DAYS: "180"
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Fetch
        run: uv run jobpipe fetch --preset "config/runs/${PRESET}.yaml"

      - name: Normalise
        run: uv run jobpipe normalise --preset "config/runs/${PRESET}.yaml"

      - name: Download accumulation window from archive
        # ADR-020 pure-function accumulation. Pulls every dated release within
        # the configured window so the publish step can rebuild
        # latest-${PRESET}.parquet as a deduped UNION over the window. First
        # run for a new preset finds zero matching tags and the publish step
        # logs "first-run, no archive — using fresh fetch only".
        run: |
          set -euo pipefail
          mkdir -p data/archive
          cutoff=$(date -u -d "${ACCUMULATE_WINDOW_DAYS} days ago" +%Y-%m-%d)
          echo "preset=${PRESET} window=${ACCUMULATE_WINDOW_DAYS}d cutoff=${cutoff}"
          gh release list --json tagName --limit 200 \
            | jq -r --arg p "${PRESET}" --arg c "${cutoff}" \
                '.[] | select(.tagName | startswith("data-\($p)-")) | select((.tagName | sub("data-\($p)-"; "")) >= $c) | .tagName' \
            | tee /tmp/archive_tags.txt
          while read -r tag; do
            [ -z "$tag" ] && continue
            mkdir -p "data/archive/${tag}"
            gh release download "$tag" \
              -p "latest-${PRESET}.parquet" \
              -D "data/archive/${tag}/" \
              || echo "tag=${tag} missing latest-${PRESET}.parquet (skipping)"
          done < /tmp/archive_tags.txt
          echo "staged archive snapshots:"
          ls -la data/archive/ || true

      - name: Publish (with accumulation)
        id: publish
        run: |
          set -euo pipefail
          BUNDLE=$(uv run jobpipe publish \
            --preset "config/runs/${PRESET}.yaml" \
            --accumulate-window-days "${ACCUMULATE_WINDOW_DAYS}")
          {
            echo "bundle=$BUNDLE"
            echo "date_tag=data-${PRESET}-$(date -u +%Y-%m-%d)"
            echo "latest_tag=latest-${PRESET}"
          } >> "$GITHUB_OUTPUT"

      - name: Gate (manifest row + coverage check)
        run: |
          uv run jobpipe gate \
            --manifest "${{ steps.publish.outputs.bundle }}/manifest.json" \
            --preset "config/runs/${PRESET}.yaml"

      - name: Stage bundle assets
        id: stage
        run: |
          set -euo pipefail
          STAGE="$(mktemp -d)"
          cp "${{ steps.publish.outputs.bundle }}/manifest.json" "$STAGE/"
          if [ -f "${{ steps.publish.outputs.bundle }}/benchmarks.parquet" ]; then
            cp "${{ steps.publish.outputs.bundle }}/benchmarks.parquet" "$STAGE/"
          fi
          # Flat-publish layout per ADR-019: a single latest-${PRESET}.parquet
          # lives directly under postings/. Copy as-is (no hive flattening).
          LATEST="${{ steps.publish.outputs.bundle }}/postings/latest-${PRESET}.parquet"
          if [ ! -f "$LATEST" ]; then
            echo "ERROR: expected $LATEST after publish — aborting" >&2
            exit 1
          fi
          cp "$LATEST" "$STAGE/"
          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"
          ls -la "$STAGE"

      - name: Upload to latest release (re-clobbered)
        run: |
          set -euo pipefail
          TAG="${{ steps.publish.outputs.latest_tag }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" \
              --notes "Re-clobbered on every refresh of preset ${PRESET}. See manifest.json for run_id."
          fi
          # Wipe stale assets first — `gh release upload --clobber` only
          # replaces same-named assets, so layout / preset renames leave
          # zombies. Pitfall: pitfall-release-clobber-zombies.
          gh release view "$TAG" --json assets --jq '.assets[].name' \
            | while read -r name; do
                [ -n "$name" ] && gh release delete-asset "$TAG" "$name" --yes
              done
          # shellcheck disable=SC2046
          gh release upload "$TAG" --clobber $(find "${{ steps.stage.outputs.stage }}" -type f)

      - name: Upload to dated release (immutable, idempotent per day)
        run: |
          set -euo pipefail
          TAG="${{ steps.publish.outputs.date_tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping dated upload (idempotent)."
            exit 0
          fi
          gh release create "$TAG" --title "$TAG" \
            --notes "Weekly snapshot for preset ${PRESET}. Immutable."
          # shellcheck disable=SC2046
          gh release upload "$TAG" $(find "${{ steps.stage.outputs.stage }}" -type f)

      - name: Alert on failure
        # A red cron run otherwise fails silently: the strict gate correctly
        # ships nothing, the dashboard keeps serving the last good release,
        # and nobody is notified — silent data staleness. File (or bump) a
        # tracking issue so the failure surfaces in notifications.
        if: failure()
        run: |
          set -euo pipefail
          TITLE="refresh failed: preset ${PRESET}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY="Weekly refresh for preset \`${PRESET}\` failed on $(date -u +%Y-%m-%d).

          Run: ${RUN_URL}
          Trigger: ${{ github.event_name }}

          Until this is fixed the dashboard keeps serving the last good \`latest-${PRESET}\` release (data goes stale, it does not break)."
          EXISTING=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
